name: Release Sector Siege
on:
  push:
    branches: [master]
    paths: [VERSION, '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 xorg-dev xvfb xdotool
      - name: Download Raylib SDKs
        run: |
          curl -fsSL https://github.com/raysan5/raylib/archive/refs/tags/6.0.tar.gz -o linux.tgz
          tar xzf linux.tgz
          cmake -S raylib-6.0 -B sdk-build -DBUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/raylib-6.0_linux_amd64"
          cmake --build sdk-build --parallel 4
          cmake --install sdk-build
          cp raylib-6.0/LICENSE raylib-6.0_linux_amd64/LICENSE
          cmake -S raylib-6.0 -B windows-build -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres -DBUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/raylib-6.0_win64_mingw-w64"
          cmake --build windows-build --parallel 4
          cmake --install windows-build
          cp raylib-6.0/LICENSE raylib-6.0_win64_mingw-w64/LICENSE
      - name: Verify flight and native input
        run: |
          ln -s raylib-6.0_linux_amd64 raylib
          export LD_LIBRARY_PATH="$PWD/raylib/lib"
          gcc build.c -o build
          ./build
          ./build --checks
          sh tests/verify.sh
      - name: Build and inspect packages
        run: |
          bash scripts/package.sh linux raylib-6.0_linux_amd64
          CC=x86_64-w64-mingw32-gcc bash scripts/package.sh windows raylib-6.0_win64_mingw-w64
          mkdir smoke
          tar xzf dist/*.tar.gz -C smoke
          exe=$(realpath smoke/*/SectorSiege)
          cd /tmp
          timeout 30 xvfb-run -a "$exe" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem *.zip).FullName game
          $exe = Get-ChildItem game -Recurse -Filter SectorSiege.exe
          # The hosted Windows runner needs a software OpenGL implementation.
          curl.exe -fsSL https://github.com/pal1000/mesa-dist-win/releases/download/26.3.1/mesa3d-26.3.1-release-msvc.7z -o mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $gl = Get-ChildItem mesa -Recurse -Filter opengl32.dll | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (!$gl) { throw 'Missing x64 Mesa driver' }
          Copy-Item "$($gl.DirectoryName)/*.dll" $exe.DirectoryName
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $p = Start-Process $exe.FullName -ArgumentList '--smoke-test' -RedirectStandardOutput game.log -RedirectStandardError errors.log -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Game smoke test timed out' }
          Get-Content game.log,errors.log
          if ($p.ExitCode -ne 0) { throw "Game smoke test failed ($($p.ExitCode))" }
  publish:
    needs: windows-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          gh release create "v$version" --target "$GITHUB_SHA" --title "Sector Siege $version" --notes "Fly escort for Mercy Six through the Aster blockade. Extract the archive for your platform and launch SectorSiege. Includes the full campaign, portraits, flight records and four difficulty settings." dist/*
